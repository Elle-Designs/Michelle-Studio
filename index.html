<script>
// ---- Storage fallback -------------------------------------------------
// Inside Claude, window.storage already exists and this block does nothing.
// Anywhere else (local file, GitHub Pages, a collaborator's browser) we fall
// back to the browser's localStorage so the app can run and persist data.
// Contract matches Claude's API: get/set resolve to an object on success;
// get throws for a missing key; set resolves null on failure.
(function(){
  if (typeof window.storage !== 'undefined') return;
  var PREFIX = 'michelle-studio:';
  window.storage = {
    get: async function(key){
      var v = window.localStorage.getItem(PREFIX + key);
      if (v === null) throw new Error('Key not found: ' + key);
      return { key: key, value: v, shared: false };
    },
    set: async function(key, value){
      try { window.localStorage.setItem(PREFIX + key, value); return { key: key, value: value, shared: false }; }
      catch (e) { console.error('storage fallback set failed:', e); return null; }
    },
    delete: async function(key){
      try { window.localStorage.removeItem(PREFIX + key); return { key: key, deleted: true, shared: false }; }
      catch (e) { return null; }
    },
    list: async function(prefix){
      var keys = [];
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);
        if (k.indexOf(PREFIX) === 0) { var name = k.slice(PREFIX.length); if (!prefix || name.indexOf(prefix) === 0) keys.push(name); }
      }
      return { keys: keys, prefix: prefix, shared: false };
    }
  };
})();
</script>

function projectOutreach(projectId){
  var out = [];

    var aSent = projectOutreach(a.id).some(function(o){ return o.clientId===client.id; });
    var bSent = projectOutreach(b.id).some(function(o){ return o.clientId===client.id; });
    if(aSent!==bSent) return aSent ? 1 : -1;
    return projectScore(b) - projectScore(a);
  });
  return candidates[0] || null;
}

function suggestAction(c, today){
  var status = derivedStatus(c);
  if(status==='Won' || status==='Rejected') return null;
  var fit = weightedFit(c.fit);
  var nextFU = derivedNextFollowUp(c);
  var lastContact = derivedLastContact(c);

  if(nextFU && nextFU <= today){
    var overdueBy = daysBetween(nextFU, today);
    return {label: overdueBy>0 ? 'Follow up now — overdue '+overdueBy+'d' : 'Follow up today', urgency:'high'};
  }
  if(status==='Not Contacted'){
    if(fit>=3.5) return {label:'Send first outreach', urgency:'high'};
    return {label:'Outreach when time allows', urgency:'low'};
  }
  if(status==='Replied'){
    var best = bestProjectForClient(c);
    if(best) return {label:'Send "'+best.title+'" — your strongest '+c.category+' piece', urgency:'high'};
    return {label:'Send '+c.category+' portfolio — next step', urgency:'high'};
  }
  if(status==='Portfolio Sent'){
    var days2 = lastContact ? daysBetween(lastContact, today) : 0;
    if(days2>=7) return {label:'Check in after portfolio', urgency:'medium'};
    return {label:'Awaiting response to portfolio', urgency:'low'};
  }
  if(status==='Proposal Sent'){
    var days = lastContact ? daysBetween(lastContact, today) : 0;
    if(days>=10) return {label:'Check in on proposal', urgency:'medium'};
    return {label:'Awaiting response', urgency:'low'};
  }
  if(status==='Meeting Scheduled') return {label:'Prepare for meeting', urgency:'medium'};
  if(status==='Contacted' || status==='Follow-up Sent'){
    if(!nextFU) return {label:'Schedule a follow-up', urgency:'medium'};
    return {label:'Waiting — follow-up '+fmtDate(nextFU), urgency:'low'};
  }
  return {label:'No action needed', urgency:'low'};
}

function toast(msg){
  var el = document.getElementById('ms-toast-el'); if(el) el.remove();
  var t = document.createElement('div'); t.id='ms-toast-el'; t.className='ms-toast';
  var span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  document.getElementById('ms-app').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 2600);
}
function showUndoToast(msg, undoFn){
  var el = document.getElementById('ms-toast-el'); if(el) el.remove();
  var t = document.createElement('div'); t.id='ms-toast-el'; t.className='ms-toast';
  var span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  var btn = document.createElement('button'); btn.textContent = 'Undo'; btn.className = 'ms-toast-undo';
  btn.onclick = function(){ if(t.parentNode) t.remove(); undoFn(); };
  t.appendChild(btn);
  document.getElementById('ms-app').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 6000);
}

function logOutreach(clientId, type, followUpDate, projectIds){
  var c = state.clients.find(function(x){ return x.id===clientId; });
  if(!c) return null;
  c.history = c.history || [];
  var entry = {id: uid(), date: todayStr(), ts: Date.now(), type: type, followUpDate: (type==='Won'||type==='Rejected') ? null : (followUpDate || null)};
  if(projectIds && projectIds.length) entry.projectIds = projectIds;
  c.history.unshift(entry);
  saveClients();
  return entry.id;
}
function logWithUndo(clientId, type, followUpDate, projectIds){
  var c = state.clients.find(function(x){ return x.id===clientId; });
  if(!c) return null;
  var entryId = logOutreach(clientId, type, followUpDate, projectIds);
  return {
    message: c.company + ' — "' + type + '" logged.',
    undo: function(){
      var cc = state.clients.find(function(x){ return x.id===clientId; });
      if(!cc) return;
      cc.history = cc.history.filter(function(h){ return h.id !== entryId; });
      saveClients();
      render();
      toast('Undone');
    }
  };
}
function editHistoryItem(clientId, itemId, field, value){
  var c = state.clients.find(function(x){ return x.id===clientId; });
  if(!c) return;
  var item = (c.history||[]).find(function(h){ return h.id===itemId; });
  if(!item) return;
  item[field] = value || null;
  saveClients();
}
function deleteHistoryItem(clientId, itemId){
  var c = state.clients.find(function(x){ return x.id===clientId; });
  if(!c) return;
  var idx = c.history.findIndex(function(h){ return h.id===itemId; });
  if(idx===-1) return;
  var removed = c.history[idx]; var removedIdx = idx;
  c.history.splice(idx,1);
  saveClients(); render();
  showUndoToast('Interaction deleted.', function(){
    var cc = state.clients.find(function(x){ return x.id===clientId; });
    if(!cc) return;
    cc.history.splice(removedIdx, 0, removed);
    saveClients(); render(); toast('Restored');
  });
}
function defaultFollowUp(type){
  if(type==='Won' || type==='Rejected') return null;
  if(type==='Meeting Scheduled') return addDays(todayStr(), 1);
  return addDays(todayStr(), 7);

function activeClientCountForIndustry(industry){
  return state.clients.filter(function(c){ return c.category===industry && !isClosed(c); }).length;
}
function computeCoverageGaps(){
  var gaps = [];
  INDUSTRIES.forEach(function(ind){
    var projCount = state.projects.filter(function(p){ return (p.industries||[]).indexOf(ind)>-1 && p.status==='Active'; }).length;
    var clientCount = activeClientCountForIndustry(ind);
    if(clientCount>0 && projCount===0){
      gaps.push({label:'No portfolio piece for '+ind+' — '+clientCount+' active client'+(clientCount>1?'s':'')+' waiting', urgency:'high'});
    } else if(clientCount>0 && projCount===1){
      gaps.push({label:'Only one '+ind+' piece — thin coverage for '+clientCount+' active clients', urgency:'medium'});
    }
  });
  SERVICES.forEach(function(svc){
    var strong = state.projects.filter(function(p){ return (p.services||[]).indexOf(svc)>-1 && p.confidence>=4 && p.status==='Active'; }).length;
    if(strong===0){
      gaps.push({label:'No strong case study yet for '+svc, urgency:'medium'});
    }
  });
  return gaps.sort(function(a,b){ return URGENCY_RANK[a.urgency]-URGENCY_RANK[b.urgency]; });
}
function computeContentBacklog(){
  var items = [];
  state.projects.filter(function(p){ return p.status==='Active' && p.confidence>=4; }).forEach(function(p){
    CONTENT_CHANNELS.forEach(function(ch){
      var st = (p.content && p.content[ch]) || 'Not Started';
      if(st!=='Posted'){
        items.push({project:p, channel:ch, label:'"'+p.title+'" → '+CONTENT_CHANNEL_LABELS[ch]+' candidate ('+st+')'});
      }
    });
  });
  return items.slice(0,8);
}
function computeStale(){
  var today = todayStr();
  return state.projects.filter(function(p){ return p.status==='Active' && p.completedDate; })
    .map(function(p){ return {p:p, age: daysBetween(p.completedDate, today)}; })
    .filter(function(x){ return x.age >= 365; })
    .sort(function(a,b){ return b.age-a.age; })
    .slice(0,5);
}
function computeUnused(){
  var today = todayStr();
  return state.projects.filter(function(p){ return p.status==='Active'; }).map(function(p){
    var hist = projectOutreach(p.id);
    var lastUsed = hist.length ? hist[0].date : null;
    return {p:p, lastUsed:lastUsed, daysSince: lastUsed ? daysBetween(lastUsed, today) : null};
  }).filter(function(x){ return !x.lastUsed || x.daysSince>=60; })
    .sort(function(a,b){ return (b.daysSince||9999)-(a.daysSince||9999); })
    .slice(0,5);
}

function renderNav(){
  var items = [{id:'dashboard', label:'Today'}, {id:'clients', label:'Target Clients'}, {id:'portfolio', label:'Portfolio'}];
  var future = ['Process library','Content planner','Finance','Weekly review'];
  var html = '<div class="ms-nav"><p class="ms-brand">Michelle Studio</p><p class="ms-brand-sub">Creative operating system</p>';
  items.forEach(function(it){
    var activeRoute = state.route===it.id || (it.id==='portfolio' && state.route==='portfolioAll');
    html += '<div class="ms-navitem '+(activeRoute?'active':'')+'" onclick="MS.go(\''+it.id+'\')"><span class="ms-navdot"></span>'+it.label+'</div>';
  });
  html += '<p class="ms-navgroup-label">Coming next</p>';
  future.forEach(function(f){
    html += '<div class="ms-navitem locked"><span class="ms-navdot" style="background:var(--ink-faint)"></span>'+f+'</div>';
  });
  html += '</div>';
  return html;
}

function render(){
  var app = document.getElementById('ms-app');
  var page;
  if(state.route==='dashboard') page = renderDashboard();
  else if(state.route==='clients') page = renderClients();
  else if(state.route==='portfolio') page = renderPortfolio();
  else if(state.route==='portfolioAll') page = renderPortfolioAll();
  else page = renderDashboard();

  var inner = '<div style="position:relative;flex:1;display:flex;">';
  inner += renderNav();
  inner += '<div class="ms-main">'+page+'</div>';
  if(state.drawer!==null && state.drawer!==undefined) inner += renderDrawer();
  if(state.projectDrawer!==null && state.projectDrawer!==undefined) inner += renderProjectDrawer();
  inner += '</div>';
  app.innerHTML = inner;

  if(state.drawer && document.getElementById('portfolio-picker') && state._pendingProjectPick){
    document.querySelectorAll('#portfolio-picker-chips .ms-chk').forEach(function(el){
      if(state._pendingProjectPick.indexOf(el.dataset.pid)>-1) el.classList.add('on');
    });
  }
}

window.MS = {
  go: function(route, filters){
    state.route = route;
    if(filters && filters.status){ state.filterStatus = filters.status; state.showClosed = true; }
    if(filters && filters.cat){ state.filterCat = filters.cat; }
    render();
  },
  setFilter: function(key, val){
    if(key==='cat') state.filterCat = val;
    if(key==='status') state.filterStatus = val;
    if(key==='search') state.search = val;
    if(key==='showClosed') state.showClosed = val;
    render();
  },
  sortTable: function(key){
    if(state.tableSortKey===key){ state.tableSortDir *= -1; } else { state.tableSortKey = key; state.tableSortDir = 1; }
    render();
  },
  toggleExpand: function(id){
    state.expandedRow = state.expandedRow===id ? null : id;
    render();
  },
  cmdType: function(v){
    state.cmdQuery = v; state.cmdActive = null;
    render();
    var el = document.querySelector('.ms-cmdinput');
    if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
  },
  cmdSelect: function(id){ state.cmdActive = id; state.cmdQuery = ''; render(); },
  cmdClear: function(){ state.cmdActive = null; state.cmdQuery = ''; render(); },
  logQuick: function(id, type){
    var pending = logWithUndo(id, type, defaultFollowUp(type));
    state.expandedRow = null; state.cmdActive = null; state.cmdQuery = '';
    render();
    if(pending) showUndoToast(pending.message, pending.undo);
  },
  openDrawer: function(id){
    state.drawer = !id ? {} : state.clients.find(function(c){ return c.id===id; });
    state._pendingProjectPick = [];
    render();
  },
  closeDrawer: function(){ state.drawer = null; render(); },
  onFitChange: function(input){
    var k = input.dataset.fitkey;
    document.getElementById('fitval-'+k).textContent = input.value;
    var vals = {};
    document.querySelectorAll('[data-fitkey]').forEach(function(el){ vals[el.dataset.fitkey] = parseInt(el.value,10); });
    document.getElementById('fit-total').textContent = weightedFit(vals);
  },
  onLogActionChange: function(val){
    var picker = document.getElementById('portfolio-picker');
    if(picker) picker.style.display = (val==='Portfolio Sent') ? 'block' : 'none';
  },
  togglePickProject: function(el){
    el.classList.toggle('on');
    var pid = el.dataset.pid;
    state._pendingProjectPick = state._pendingProjectPick || [];
    toggleInArray(state._pendingProjectPick, pid);
  },
  pickPreset: function(btn){
    document.querySelectorAll('#preset-row .ms-preset').forEach(function(b){ b.classList.remove('selected'); });
    btn.classList.add('selected');
    var customInput = document.getElementById('preset-custom-date');
    customInput.style.display = btn.dataset.days==='custom' ? 'block' : 'none';
  },
  logFromDrawer: function(){
    var type = document.getElementById('log-action').value;
    var selected = document.querySelector('#preset-row .ms-preset.selected');
    var days = selected ? selected.dataset.days : '7';
    var followUp;
    if(days==='none') followUp = null;
    else if(days==='custom') followUp = document.getElementById('preset-custom-date').value || null;
    else followUp = addDays(todayStr(), parseInt(days,10));
    var projectIds = (type==='Portfolio Sent') ? (state._pendingProjectPick||[]) : [];
    var pending = logWithUndo(state.drawer.id, type, followUp, projectIds);
    state.drawer = state.clients.find(function(c){ return c.id===state.drawer.id; });
    state._pendingProjectPick = [];
    render();
    if(pending) showUndoToast(pending.message, pending.undo);
  },
  saveForm: function(e){
    e.preventDefault();
    var f = e.target;
    var data = state.drawer && state.drawer.id ? Object.assign({}, state.drawer) : {history:[]};
    ['company','category','country','website','instagram','linkedin','decisionMaker','email','phone','services','priority','whyFit','notes'].forEach(function(k){
      data[k] = f[k].value;
    });
    var fit = {};
    document.querySelectorAll('[data-fitkey]').forEach(function(el){ fit[el.dataset.fitkey] = parseInt(el.value,10); });
    data.fit = fit;
    if(!data.id){ data.id = uid(); state.clients.push(data); }
    else { var idx = state.clients.findIndex(function(c){ return c.id===data.id; }); state.clients[idx] = data; }
    saveClients();
    state.drawer = null;
    render();
    toast('Client saved');
  },
  deleteClient: function(){
    state.clients = state.clients.filter(function(c){ return c.id !== state.drawer.id; });
    saveClients();
    state.drawer = null;
    render();
    toast('Client deleted');
  },
  editHistory: function(clientId, itemId, field, value){
    editHistoryItem(clientId, itemId, field, value);
    state.drawer = state.clients.find(function(c){ return c.id===clientId; });
    render();
  },
  deleteHistory: function(clientId, itemId){
    deleteHistoryItem(clientId, itemId);
    state.drawer = state.clients.find(function(c){ return c.id===clientId; });
    render();
  },

  // ---- project drawer ----
  openProjectDrawer: function(id){
    if(!id){
      state.projectDrawer = {id:null, title:'', completedDate:'', status:'Active', services:[], industries:[], skills:[],
        confidence:3, commercialValue:3,
        content:{behance:'Not Started', instagram:'Not Started', tiktok:'Not Started'},
        links:{behance:'', instagram:'', tiktok:''},
        processFiles:'', finalDeliverable:'', notes:''};
    } else {
      state.projectDrawer = state.projects.find(function(p){ return p.id===id; });
    }
    render();
  },
  updateProjectField: function(name, value){
    if(state.projectDrawer) state.projectDrawer[name] = value;
  },
  updateProjectNestedField: function(group, key, value){
    var d = state.projectDrawer;
    if(!d) return;
    d[group] = d[group] || {};
    d[group][key] = value;
  },
  updateContentStatus: function(ch, value){
    var d = state.projectDrawer;
    if(!d) return;
    d.content = d.content || {};
    d.content[ch] = value;
    // Intentionally do not touch d.links[ch] here — switching to/from Candidate
    // must never delete an existing link, only lock/unlock editing of it.
    render();
  },
  closeProjectDrawer: function(){ state.projectDrawer = null; render(); },
  toggleProjectTag: function(field, val){
    var d = state.projectDrawer;
    d[field] = d[field] || [];
    toggleInArray(d[field], val);
    render();
  },

      confidence: d.confidence || 3,

      links: d.links || {},
      processFiles: d.processFiles || '',
      finalDeliverable: d.finalDeliverable || '',
      notes: d.notes || ''
    };
    if(!data.title){ toast('Give the project a title first'); return; }

    // TEMP DIAGNOSTIC — remove after verifying real storage.set() behavior in production
    console.log('[MS DIAGNOSTIC] BEFORE SAVE — project object:', JSON.parse(JSON.stringify(data)));
    console.log('[MS DIAGNOSTIC] BEFORE SAVE — project id:', data.id, '| projects array length before:', state.projects.length);

    var idx = state.projects.findIndex(function(p){ return p.id===data.id; });
    var wasNew = idx === -1;
    var prevSnapshot = wasNew ? null : Object.assign({}, state.projects[idx]);
    if(wasNew) state.projects.push(data); else state.projects[idx] = data;

    // TEMP DIAGNOSTIC
    var payload = JSON.stringify(state.projects);
    console.log('[MS DIAGNOSTIC] DURING SAVE — storage key: "projects" | payload length (chars):', payload.length, '| payload:', payload);

    var ok = await saveProjects();

    // TEMP DIAGNOSTIC
    console.log('[MS DIAGNOSTIC] DURING SAVE — saveProjects() resolved to:', ok);
    try{
      var verifyRead = await window.storage.get('projects');
      console.log('[MS DIAGNOSTIC] AFTER SAVE — window.storage.get("projects") returned:', verifyRead);
      if(verifyRead && verifyRead.value){
        var verifyParsed = JSON.parse(verifyRead.value);
        var found = verifyParsed.find(function(p){ return p.id === data.id; });
        console.log('[MS DIAGNOSTIC] AFTER SAVE — new project present in freshly-read storage:', !!found, found);
      }
    }catch(diagErr){
      console.log('[MS DIAGNOSTIC] AFTER SAVE — window.storage.get("projects") threw:', diagErr);
    }

    if(!ok){
      // Roll back the in-memory change so app state matches what's actually persisted.
      // Drawer stays open with the user's edits intact so they can retry without re-typing anything.
      if(wasNew){ state.projects.pop(); } else { state.projects[idx] = prevSnapshot; }
      toast('Could not save the project — please try again.');
      return;
    }

    state.projectDrawer = null;
    render();
    toast('Project saved');
  },
  deleteProject: function(){
    state.projects = state.projects.filter(function(p){ return p.id !== state.projectDrawer.id; });
    saveProjects();
    state.projectDrawer = null;
    render();
    toast('Project deleted');
  }
};

loadData();
})();
</script>
